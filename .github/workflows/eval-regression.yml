name: Standalone skill eval report

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate:
    name: Evaluate skill regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run deterministic smoke evals
        run: npm run test:eval

      - name: Generate current eval result and PR report
        run: |
          mkdir -p artifacts
          node dist/cli.js run \
            --dataset evals/datasets/resolved-smoke.json \
            --output-json artifacts/current-result.json
          node dist/cli.js compare \
            --baseline evals/baselines/word-puzzle-v1.result.json \
            --candidate artifacts/current-result.json \
            --output-md artifacts/skill-eval-report.md

      - name: Publish or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- skill-eval-report -->";
            const report = fs.readFileSync("artifacts/skill-eval-report.md", "utf8");
            const body = `${marker}\n${report}\n\n_Produced by the deterministic, zero-cost skill-eval CI._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
